<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e"><title>Keuangan TPQ Remaja</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f6f6;--cd:#fff;--tx:#14201f;--mu:#5b6967;--pr:#0f766e;--on:#fff;--bd:#d9e1e0;--bad:#b42318;--ok:#067647}
@media(prefers-color-scheme:dark){:root{--bg:#0f1514;--cd:#18211f;--tx:#e8efee;--mu:#9fb0ad;--pr:#2dd4bf;--on:#06201c;--bd:#2a3633;--bad:#f97066;--ok:#47cd89}}
*{box-sizing:border-box}body{margin:0;font:16px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:env(safe-area-inset-top) 0 calc(64px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--pr);color:var(--on)}
header b{font-size:17px}header small{opacity:.85}
main{padding:12px;max-width:720px;margin:auto}h2{font-size:18px;margin:6px 0 10px}h3{font-size:15px;margin:16px 0 6px}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.k{font-size:12px;color:var(--mu)}.v{font-size:19px;font-weight:700}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 3px}
input,select,textarea,button{font:inherit;width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--cd);color:var(--tx)}
button{background:var(--pr);color:var(--on);border:0;font-weight:700;margin-top:12px}button.s{background:transparent;color:var(--pr);border:1px solid var(--pr)}
button:disabled{opacity:.5}header button{width:auto;margin:0;padding:6px 12px;background:rgba(255,255,255,.2);color:var(--on)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;text-align:center;padding:12px 4px;color:var(--mu);font-size:13px;font-weight:600}nav a.on{color:var(--pr);box-shadow:inset 0 3px var(--pr)}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}td.n,th.n{text-align:right}
.mu{color:var(--mu)}.bad{color:var(--bad)}.ok{color:var(--ok)}
#t{position:fixed;left:12px;right:12px;bottom:78px;padding:12px;border-radius:10px;background:#14201f;color:#fff;display:none;z-index:9}#t.bad{background:var(--bad)}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row span{flex:0 0 auto}
</style></head>
<body><header><div><b>Keuangan TPQ</b><br><small id="who"></small></div><button id="lo" hidden>Keluar</button></header>
<main id="v"><p class="mu">Memuat…</p></main><nav id="nv" hidden></nav><div id="t"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="config.js"></script><script src="logic.js"></script>
<script>
const {esc,rp}=L, $=s=>document.querySelector(s), v=$('#v');
if(/ISI-/.test(CFG.url+CFG.key)){v.innerHTML='<div class="cd"><h2>Belum terhubung ke database</h2><p>Buka berkas <b>config.js</b> di GitHub, ganti <b>url</b> dan <b>key</b> dengan nilai dari Supabase (Project Settings &gt; API), lalu simpan.</p></div>';throw new Error('config belum diisi')}
const sb=supabase.createClient(CFG.url,CFG.key);
const S={prof:null,funds:[],members:[],month:L.todayWIB().slice(0,7),payKey:crypto.randomUUID(),expKey:crypto.randomUUID(),expPath:null,rep:null};
const fd=c=>(S.funds.find(f=>f.code===c)||{}).name||c;
const call=async p=>{const r=await p;if(r.error)throw new Error(r.error.message);return r.data};
function toast(m,bad){const t=$('#t');t.textContent=m;t.className=bad?'bad':'';t.style.display='block';clearTimeout(t.h);t.h=setTimeout(()=>t.style.display='none',bad?7000:3000)}
const staff=()=>S.prof.role!=='pengurus';
const monthBox=()=>`<label>Bulan</label><input type="month" id="bln" value="${S.month}">`;
const bindMonth=f=>{$('#bln').onchange=e=>{if(e.target.value){S.month=e.target.value;f()}}};
// kolom: [kunci, judul, jenis] jenis 1 uang, 2 bulan, 3 status, 4 kelompok, 5 nama dana
const C={
 member:[['member_name','Nama'],['grp','Kelompok',4],['fund_code','Dana',5],['amount_due','Kewajiban',1],['paid','Dibayar',1],['remaining','Kekurangan',1],['status','Status',3],['month_arrears','Tunggakan bulan ini',1],['cumulative_arrears','Tunggakan total',1]],
 arrears:[['member_name','Nama'],['grp','Kelompok',4],['month_arrears','Tunggakan bulan ini',1],['cumulative_arrears','Tunggakan total',1]],
 fund:[['fund_name','Dana'],['saldo_awal_periode','Saldo awal periode',1],['saldo_awal_dicatat','Saldo awal dicatat (bukan pemasukan)',1],['iuran','Iuran wajib',1],['sukarela','Sukarela',1],['transfer_net','Transfer',1],['pengeluaran','Pengeluaran',1],['saldo_akhir','Saldo akhir',1]],
 vol:[['member_name','Nama'],['grp','Kelompok',4],['fund_code','Dana',5],['total','Total',1],['jumlah_setoran','Jumlah setoran']],
 qur:[['fund_name','Dana'],['saldo_awal','Saldo awal',1],['iuran_diterima','Iuran diterima',1],['pengeluaran','Pengeluaran',1],['saldo_tersisa','Saldo tersisa',1],['target','Target',1],['persen_target','% target']],
 det:[['pay_date','Tanggal'],['member_name','Nama'],['fund_code','Dana',5],['for_month','Untuk bulan',2],['amount','Jumlah',1],['note','Catatan']]};
function tbl(cols,rows){if(!rows.length)return'<p class="mu">Tidak ada data.</p>';
 return'<div class="sc"><table><tr>'+cols.map(c=>`<th${c[2]===1?' class="n"':''}>${c[1]}</th>`).join('')+'</tr>'+rows.map(r=>'<tr>'+cols.map(c=>{const x=L.cell(c[2],r[c[0]],fd);return`<td${c[2]===1?' class="n"':''}>${esc(c[2]===1?rp(x):x)}</td>`}).join('')+'</tr>').join('')+'</table></div>'}

// ---------- Masuk / keluar ----------
function loginView(){$('#nv').hidden=true;$('#lo').hidden=true;$('#who').textContent='';
 v.innerHTML=`<div class="cd"><h2>Masuk</h2><label>Nama pengguna atau email</label><input id="u" autocapitalize="none" autocomplete="username"><label>Kata sandi</label><input id="p" type="password" autocomplete="current-password"><button id="go">Masuk</button></div>`;
 $('#go').onclick=async()=>{const u=$('#u').value.trim(),email=u.includes('@')?u:u+'@tpq-remaja.app';
  $('#go').disabled=true;const {error}=await sb.auth.signInWithPassword({email,password:$('#p').value});$('#go').disabled=false;
  if(error)return toast('Gagal masuk. Periksa nama pengguna dan kata sandi.',1);boot()}}
$('#lo').onclick=async()=>{await sb.auth.signOut();loginView()};
async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session)return loginView();
 try{const [p,f,m]=await Promise.all([call(sb.from('profiles').select('full_name,role,is_active,must_change_password').eq('id',session.user.id).maybeSingle()),
   call(sb.from('funds').select('code,name,kind,is_qurban').order('code')),call(sb.from('members').select('id,name,grp,inactive_from').order('name'))]);
  if(!p||!p.is_active){await sb.auth.signOut();return loginView(),toast('Akun belum aktif. Hubungi admin.',1)}
  S.prof=p;S.funds=f;S.members=m;if(p.must_change_password)return pwView();$('#who').textContent=p.full_name+' · '+p.role;$('#lo').hidden=false;tabs();go('home')}
 catch(e){toast(e.message,1)}}
function pwView(){$('#nv').hidden=true;$('#lo').hidden=false;$('#who').textContent=S.prof.full_name;
 v.innerHTML=`<div class="cd"><h2>Ganti kata sandi</h2><p class="k">Kata sandi sementara harus diganti sebelum memakai aplikasi. Minimal 10 karakter.</p><label>Kata sandi baru</label><input id="n1" type="password" autocomplete="new-password"><label>Ulangi kata sandi baru</label><input id="n2" type="password" autocomplete="new-password"><button id="sp">Simpan kata sandi</button></div>`;
 $('#sp').onclick=async()=>{const a=$('#n1').value,m=L.pwCheck(a,$('#n2').value);if(m)return toast(m,1);
  const {error}=await sb.auth.updateUser({password:a});if(error)return toast(error.message,1);
  try{await call(sb.rpc('clear_must_change'))}catch(e){return toast(e.message,1)}toast('Kata sandi diganti.');boot()}}
const T={home:['Beranda',()=>home()],bayar:['Bayar',()=>bayar()],keluar:['Pengeluaran',()=>keluar()],laporan:['Laporan',()=>laporan()]};
function tabs(){const n=$('#nv');n.hidden=false;n.innerHTML=L.tabsFor(S.prof.role).map(k=>`<a href="#" data-k="${k}">${T[k][0]}</a>`).join('');
 n.onclick=e=>{const a=e.target.closest('a');if(a){e.preventDefault();go(a.dataset.k)}}}
function go(k){document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.k===k));v.innerHTML='<p class="mu">Memuat…</p>';
 Promise.resolve(T[k][1]()).catch(e=>{v.innerHTML=`<p class="bad">${esc(e.message)}</p>`})}

// ---------- Beranda ----------
async function home(){const ms=L.monthStart(S.month),me=L.monthEnd(S.month);
 const [d,fb,q,bz,bk]=await Promise.all([call(sb.rpc('dashboard_summary',{p_month:ms})),call(sb.from('fund_balances').select('*')),call(sb.rpc('qurban_report')),
   staff()?call(sb.rpc('business_summary',{p_from:ms,p_to:me})):[],
   staff()?call(sb.from('backup_runs').select('run_at,status').order('run_at',{ascending:false}).limit(1)):null]);
 const x=d[0];
 const bs=staff()?L.backupState(bk[0],Date.now()):null;
 v.innerHTML=(bs?`<div class="cd ${bs.bad?'bad':'ok'}">${esc(bs.text)}</div>`:'')+monthBox()+(staff()&&!x.kewajiban_dibuat?`<button id="mk">Buat kewajiban ${L.bulan(ms)}</button>`:'')+
 `<div class="g" style="margin-top:10px"><div class="cd"><div class="k">Anggota aktif</div><div class="v">${x.anggota_aktif}</div></div>
 <div class="cd"><div class="k">Target kewajiban</div><div class="v">${rp(x.target_bulanan)}</div></div>
 <div class="cd"><div class="k">Sudah diterima</div><div class="v ok">${rp(x.diterima_untuk_bulan)}</div></div>
 <div class="cd"><div class="k">Tunggakan bulan ini</div><div class="v bad">${rp(x.tunggakan_bulan_berjalan)}</div></div></div>
 <div class="cd"><div class="k">Tunggakan akumulatif (semua bulan belum lunas)</div><div class="v bad">${rp(x.tunggakan_akumulatif)}</div></div>
 <h3>Saldo setiap dana</h3><div class="cd">${L.kas(fb).map(f=>`<div class="row"><span>${esc(f.name)}</span><b style="text-align:right">${rp(f.saldo)}</b></div>`).join('')}</div>
 <h3>Dana qurban</h3>${q.map(f=>`<div class="cd"><b>${esc(f.fund_name)}</b><div class="k">Terkumpul ${rp(Number(f.saldo_awal)+Number(f.iuran_diterima)+Number(f.transfer_net))} · Pengeluaran ${rp(f.pengeluaran)} · Sisa ${rp(f.saldo_tersisa)}</div>
  <div>${f.target?`Target ${rp(f.target)} — <b>${f.persen_target}%</b>`:'<span class="mu">Target belum ditetapkan</span>'}</div></div>`).join('')}`+
 (staff()?`<h3>Ringkasan usaha (khusus admin & bendahara)</h3>${tbl([['business_name','Usaha'],['pemasukan','Pemasukan',1],['biaya_operasional','Biaya ops',1],['pengeluaran_lain','Pengeluaran',1],['hasil_bersih','Hasil bersih',1],['saldo','Saldo',1]],bz)}`:'');
 bindMonth(home);const mk=$('#mk');if(mk)mk.onclick=async()=>{mk.disabled=true;try{const n=await call(sb.rpc('generate_obligations',{p_month:ms}));toast(`${n} kewajiban dibuat.`);home()}catch(e){toast(e.message,1);mk.disabled=false}}}

// ---------- Bayar ----------
async function bayar(){
 v.innerHTML=`<h2>Catat pembayaran</h2><label>Anggota</label><select id="mm"><option value="">— pilih —</option>${S.members.map(m=>`<option value="${m.id}">${esc(m.name)} (${L.GR[m.grp]})${m.inactive_from?' · keluar':''}</option>`).join('')}</select><div id="ob"></div>`;
 $('#mm').onchange=e=>{S.payKey=crypto.randomUUID();e.target.value?openOb(e.target.value):($('#ob').innerHTML='')}}
async function openOb(id){const o=$('#ob');o.innerHTML='<p class="mu">Memuat…</p>';
 const rows=await call(sb.from('obligation_status').select('obligation_id,fund_code,month,amount_due,paid,remaining').eq('member_id',id).gt('remaining',0).order('month').order('fund_code'));
 const nm=S.members.find(m=>m.id===id).name;
 o.innerHTML=`<label>Tanggal pembayaran</label><input type="date" id="dt" value="${L.todayWIB()}" max="${L.todayWIB()}">
 <h3>Iuran wajib</h3>${rows.length?`<div class="row"><input id="tot" type="number" inputmode="numeric" min="0" placeholder="Uang diterima"><span><button class="s" id="bg" style="margin:0">Bagi otomatis</button></span></div>
 <p class="k">Dibagi ke bulan terlama dulu. Anda tetap bisa mengubah tiap kolom.</p>
 <div class="sc"><table>${rows.map(r=>`<tr><td>${L.bulan(r.month)}<br><span class="k">${esc(fd(r.fund_code))} · sisa ${rp(r.remaining)}</span></td><td><input class="a" type="number" inputmode="numeric" min="0" max="${r.remaining}" data-id="${r.obligation_id}" style="width:110px"></td></tr>`).join('')}</table></div>`:'<p class="mu">Tidak ada kewajiban terbuka (buat kewajiban bulan ini di Beranda bila belum ada).</p>'}
 <h3>Sukarela</h3><label>Infaq Rezeki (IR)</label><input id="ir" type="number" inputmode="numeric" min="0"><label>Tabungan Tour</label><input id="tr" type="number" inputmode="numeric" min="0">
 <div class="cd" style="margin-top:12px"><div class="k">Total pembayaran</div><div class="v" id="sum">Rp0</div></div><button id="sv">Simpan pembayaran</button>`;
 const inputs=()=>[...document.querySelectorAll('.a')],num=e=>Math.max(0,Math.floor(+e.value||0));
 const upd=()=>{$('#sum').textContent=rp(inputs().reduce((s,e)=>s+num(e),0)+num($('#ir'))+num($('#tr')))};
 o.oninput=upd;
 const bg=$('#bg');if(bg)bg.onclick=()=>{const r=L.allocate(rows,num($('#tot')));inputs().forEach(e=>e.value=r.alloc[e.dataset.id]||'');upd();if(r.left)toast(`Sisa ${rp(r.left)} belum dibagi (kewajiban habis). Isi IR/Tour bila perlu.`)};
 $('#sv').onclick=async()=>{const alloc={};inputs().forEach(e=>{alloc[e.dataset.id]=num(e)});
  const lines=L.buildLines(alloc,{IR:num($('#ir')),TOUR:num($('#tr'))}),tot=lines.reduce((s,l)=>s+l.amount,0);
  if(!lines.length)return toast('Isi nominal pembayaran.',1);if(!confirm(`Simpan pembayaran ${rp(tot)} untuk ${nm}?`))return;
  const send=c=>call(sb.rpc('record_payment',{p_member:id,p_date:$('#dt').value,p_key:S.payKey,p_lines:lines,p_confirm_duplicate:c}));
  $('#sv').disabled=true;
  try{try{await send(false)}catch(e){if(!e.message.startsWith('DUPLIKAT_MUNGKIN'))throw e;if(!confirm('Pembayaran serupa baru saja dicatat. Tetap simpan sebagai pembayaran baru?'))throw new Error('Dibatalkan.');await send(true)}
   S.payKey=crypto.randomUUID();toast('Pembayaran tersimpan.');openOb(id)}
  catch(e){toast(e.message,1);$('#sv').disabled=false}}}

// ---------- Pengeluaran + foto bukti ----------
async function compress(file){const b=await createImageBitmap(file,{imageOrientation:'from-image'});const s=Math.min(1,1280/Math.max(b.width,b.height));
 const c=document.createElement('canvas');c.width=Math.round(b.width*s);c.height=Math.round(b.height*s);c.getContext('2d').drawImage(b,0,0,c.width,c.height);
 let blob;for(let q=.75;q>=.35;q-=.1){blob=await new Promise(r=>c.toBlob(r,'image/jpeg',q));if(blob.size<=400*1024)break}
 if(!blob||blob.size>1024*1024)throw new Error('Foto terlalu besar setelah dikompres. Coba foto ulang.');return blob}
async function keluar(){S.expPath=null;S.expKey=crypto.randomUUID();
 const rules=await call(sb.from('evidence_rules').select('id,name,max_amount').eq('is_active',true));
 v.innerHTML=`<h2>Catat pengeluaran</h2><label>Sumber dana</label><select id="fn">${S.funds.map(f=>`<option value="${f.code}">${esc(f.name)}</option>`).join('')}</select>
 <label>Tanggal</label><input type="date" id="dt" value="${L.todayWIB()}" max="${L.todayWIB()}"><label>Nominal (Rp)</label><input id="am" type="number" inputmode="numeric" min="1">
 <label>Keterangan dan tujuan</label><textarea id="tj" rows="2"></textarea><div id="cat"></div>
 <label>Jenis bukti</label><select id="bk"><option value="f">Foto nota / kuitansi</option>${rules.length?'<option value="a">Bukti alternatif (aturan admin)</option>':''}</select><div id="bx"></div>
 <button id="sv">Simpan pengeluaran</button><p class="k">Pengeluaran tidak tersimpan jika foto belum berhasil diunggah.</p>`;
 const fnSel=()=>S.funds.find(f=>f.code===$('#fn').value);
 const cat=()=>{const f=fnSel();$('#cat').innerHTML=f.kind==='usaha'?`<label>Kategori</label><select id="ct"><option value="biaya_operasional">Biaya operasional</option><option value="umum">Pengeluaran lain</option></select>`:f.is_qurban?'<p class="k">Dana qurban: hanya untuk pembelian hewan/perlengkapan qurban.</p>':''};
 const catVal=()=>{const f=fnSel();return f.kind==='usaha'?$('#ct').value:f.is_qurban?'pembelian_qurban':'umum'};
 const bx=()=>{$('#bx').innerHTML=$('#bk').value==='f'?`<label>Foto (kamera atau galeri)</label><input type="file" id="ph" accept="image/*" capture="environment"><p class="k" id="pi"></p>`
  :`<label>Aturan bukti</label><select id="ru">${rules.map(r=>`<option value="${r.id}">${esc(r.name)}${r.max_amount?' (maks '+rp(r.max_amount)+')':''}</option>`).join('')}</select><label>Keterangan bukti (siapa saksi, mengapa tanpa nota)</label><textarea id="dtl" rows="2"></textarea>`};
 $('#fn').onchange=cat;$('#bk').onchange=bx;cat();bx();
 $('#sv').onclick=async()=>{const btn=$('#sv'),am=Math.floor(+$('#am').value||0),tj=$('#tj').value.trim();
  if(am<=0||!tj)return toast('Isi nominal dan keterangan.',1);let path=null,rule=null,detail=null;
  if($('#bk').value==='f'){const f=$('#ph').files[0];if(!f&&!S.expPath)return toast('Foto nota wajib.',1);path=S.expPath}
  else{rule=$('#ru').value;detail=$('#dtl').value.trim();if(!detail)return toast('Isi keterangan bukti.',1)}
  if(!confirm(`Simpan pengeluaran ${rp(am)} dari ${fd($('#fn').value)}?`))return;btn.disabled=true;
  try{if($('#bk').value==='f'&&!path){btn.textContent='Mengompres foto…';const blob=await compress($('#ph').files[0]);
    btn.textContent='Mengunggah foto…';const p=`${(await sb.auth.getUser()).data.user.id}/${crypto.randomUUID()}.jpg`;
    const {error}=await sb.storage.from('bukti').upload(p,blob,{contentType:'image/jpeg',upsert:false});
    if(error)throw new Error('Unggah foto gagal. Pengeluaran BELUM tersimpan. Coba lagi. ('+error.message+')');S.expPath=path=p}
   btn.textContent='Menyimpan…';
   await call(sb.rpc('create_expense',{p_fund:$('#fn').value,p_date:$('#dt').value,p_amount:am,p_purpose:tj,p_category:catVal(),p_key:S.expKey,p_path:path,p_rule:rule,p_detail:detail}));
   S.expKey=crypto.randomUUID();S.expPath=null;toast('Pengeluaran tersimpan dengan bukti.');keluar()}
  catch(e){toast(e.message,1);btn.disabled=false;btn.textContent='Simpan pengeluaran'}}}

// ---------- Laporan + Excel ----------
async function laporan(){const g=S.rep&&S.rep.g||'',mm=S.rep&&S.rep.m||'',fn=S.rep&&S.rep.f||'';
 v.innerHTML=`<h2>Laporan kas</h2>${monthBox()}<div class="g"><div><label>Kelompok</label><select id="fg"><option value="">Semua</option>${Object.keys(L.GR).map(k=>`<option value="${k}"${g===k?' selected':''}>${L.GR[k]}</option>`).join('')}</select></div>
 <div><label>Dana</label><select id="ff"><option value="">Semua</option>${S.funds.filter(f=>f.kind==='wajib'||f.kind==='sukarela').map(f=>`<option value="${f.code}"${fn===f.code?' selected':''}>${esc(f.name)}</option>`).join('')}</select></div></div>
 <label>Anggota</label><select id="fm"><option value="">Semua</option>${S.members.map(m=>`<option value="${m.id}"${mm===m.id?' selected':''}>${esc(m.name)}</option>`).join('')}</select><div id="rp"></div>`;
 const run=()=>{S.rep={g:$('#fg').value,m:$('#fm').value,f:$('#ff').value};show()};bindMonth(laporan);['#fg','#fm','#ff'].forEach(s=>$(s).onchange=run);show()}
async function show(){const ms=L.monthStart(S.month),me=L.monthEnd(S.month),r=S.rep||{g:'',m:'',f:''},R=$('#rp');R.innerHTML='<p class="mu">Memuat…</p>';
 const a={p_group:r.g||null,p_member:r.m||null,p_fund:r.f||null};
 try{const [mr,ar,fr,vr,qr,dr]=await Promise.all([call(sb.rpc('member_report',{p_month:ms,...a})),call(sb.rpc('arrears_report',{p_month:ms,p_group:a.p_group,p_member:a.p_member})),
   call(sb.rpc('fund_report',{p_from:ms,p_to:me,p_fund:r.f||null})),call(sb.rpc('voluntary_report',{p_from:ms,p_to:me,...a})),call(sb.rpc('qurban_report')),call(sb.rpc('payment_detail',{p_from:ms,p_to:me,...a}))]);
  const kas=L.kas(fr);S.data={mr,ar,fr:kas,vr,qr,dr};
  const t=k=>mr.reduce((s,x)=>s+Number(x[k]||0),0);
  R.innerHTML=`<div class="cd"><div class="k">Kewajiban ${rp(t('amount_due'))} · Dibayar ${rp(t('paid'))} · Kekurangan <b class="bad">${rp(t('remaining'))}</b></div></div>
  <button id="xl">Ekspor ke Excel (.xlsx)</button>
  <h3>Pembayaran per anggota dan dana</h3>${tbl(C.member,mr)}<h3>Daftar tunggakan</h3>${tbl(C.arrears,ar)}
  <h3>Ringkasan setiap dana (saldo awal bukan pemasukan)</h3>${tbl(C.fund,kas)}<h3>Rincian IR dan Tabungan Tour per anggota</h3>${tbl(C.vol,vr)}
  <h3>Dana qurban</h3>${tbl(C.qur,qr)}<h3>Rincian pembayaran</h3>${tbl(C.det,dr)}`;
  $('#xl').onclick=exportXlsx}catch(e){R.innerHTML=`<p class="bad">${esc(e.message)}</p>`}}
function exportXlsx(){const D=S.data,wb=XLSX.utils.book_new();
 [['Per Anggota',C.member,D.mr,1],['Tunggakan',C.arrears,D.ar,1],['Per Dana',C.fund,D.fr,1],['IR dan Tour',C.vol,D.vr,1],['Qurban',C.qur,D.qr,0],['Rincian Bayar',C.det,D.dr,1]]
  .forEach(([n,c,r,tt])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(L.aoa(c,r,fd,!!tt)),n));
 XLSX.writeFile(wb,`laporan-kas-${S.month}.xlsx`);toast('Berkas Excel dibuat.')}

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
boot();
